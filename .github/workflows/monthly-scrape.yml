name: Monthly Wiki Archive

# Automated monthly scraping and release publication
# Runs on the 1st of each month at 2 AM UTC
# Can also be triggered manually with custom parameters

on:
  schedule:
    # Run at 2 AM UTC on the 1st of every month
    - cron: '0 2 1 * *'
  
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      scrape_type:
        description: 'Type of scrape to run'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      
      force:
        description: 'Force full scrape even if database exists'
        required: false
        default: false
        type: boolean
      
      create_release:
        description: 'Create GitHub release after scrape'
        required: false
        default: true
        type: boolean
      
      announce:
        description: 'Announce release on Discord/Slack'
        required: false
        default: false
        type: boolean
      
      reason:
        description: 'Reason for manual trigger (optional)'
        required: false
        type: string

# Secrets required:
# - GITHUB_TOKEN (automatic, for releases and artifact download)
# - DISCORD_WEBHOOK_URL (optional, for notifications)
# - SLACK_WEBHOOK_URL (optional, for notifications)

permissions:
  contents: write  # release creation
  actions: read    # previous-run artifact download

jobs:
  scrape-and-release:
    name: Scrape Wiki and Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 4320  # 3 days max (72 hours)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log trigger information
        run: |
          echo "=== Workflow Trigger Information ==="
          echo "Event: ${{ github.event_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Trigger time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo ""
            echo "=== Manual Trigger Parameters ==="
            echo "Scrape type: ${{ github.event.inputs.scrape_type }}"
            echo "Force: ${{ github.event.inputs.force }}"
            echo "Create release: ${{ github.event.inputs.create_release }}"
            echo "Announce: ${{ github.event.inputs.announce }}"
            echo "Reason: ${{ github.event.inputs.reason || 'Not provided' }}"
          else
            echo "Scheduled run (automatic)"
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache pip dependencies for faster installs
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Verify installation
        run: |
          python --version
          echo "Python installation verified"
      
      - name: Create necessary directories
        run: |
          mkdir -p data/ downloads/ logs/ releases/
      
      - name: Download previous database artifact
        id: download-db
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # download-artifact@v4 without run-id only sees artifacts of the
          # CURRENT run; the database is uploaded at the END of a run, so a
          # new run starts empty. Resolve the newest database artifact from
          # PREVIOUS runs via the Actions artifacts API instead.
          #
          # Newest-wins across both names: a run that failed during
          # backfill/materialize still uploaded its post-scrape checkpoint
          # (irowiki-database-checkpoint), and that fresher database must
          # win over the last fully successful run's final artifact.
          DB_ARTIFACT_URL=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts
              | map(select(.name == "irowiki-database" or .name == "irowiki-database-checkpoint"))
              | sort_by(.created_at) | reverse
              | .[0].archive_download_url // empty' 2>/dev/null || true)
          # Defensive: strip any JSON quoting around the URL.
          DB_ARTIFACT_URL=${DB_ARTIFACT_URL//\"/}

          if [[ -z "$DB_ARTIFACT_URL" ]]; then
            echo "No previous database artifact found - starting with an empty database"
            exit 0
          fi

          echo "Downloading previous database artifact..."
          if ! curl -sfL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$DB_ARTIFACT_URL" -o /tmp/db-artifact.zip; then
            echo "Artifact download failed - starting with an empty database"
            exit 0
          fi

          if ! unzip -o /tmp/db-artifact.zip -d data/; then
            echo "Artifact extraction failed - starting with an empty database"
            rm -f data/irowiki.db /tmp/db-artifact.zip
            exit 0
          fi
          rm -f /tmp/db-artifact.zip
          echo "✓ Restored database from previous run"
      
      - name: Check for existing database
        id: check-db
        run: |
          if [[ -f "data/irowiki.db" ]]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            SIZE=$(stat -c%s "data/irowiki.db")
            echo "size=$SIZE" >> $GITHUB_OUTPUT
            echo "✓ Found existing database: $(numfmt --to=iec-i --suffix=B $SIZE)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "size=0" >> $GITHUB_OUTPUT
            echo "No existing database found"
          fi
      
      - name: Determine scrape parameters
        id: scrape-params
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - use inputs
            SCRAPE_TYPE="${{ github.event.inputs.scrape_type }}"
            FORCE="${{ github.event.inputs.force }}"
            CREATE_RELEASE="${{ github.event.inputs.create_release }}"
            ANNOUNCE="${{ github.event.inputs.announce }}"
          else
            # Scheduled run - use defaults
            SCRAPE_TYPE="incremental"
            FORCE="false"
            CREATE_RELEASE="true"
            ANNOUNCE="true"
          fi
          
          # Self-heal scheduled runs: an incremental scrape on a missing
          # database hard-fails (FirstRunRequiresFullScrapeError), and a
          # missing DB means the artifact handoff found nothing. Fall back
          # to a full scrape so the unattended run still produces a
          # release instead of failing. Manual triggers keep the
          # operator's explicit choice (fail loudly instead).
          if [[ "${{ github.event_name }}" == "schedule" ]] \
             && [[ "${{ steps.check-db.outputs.exists }}" != "true" ]] \
             && [[ "$SCRAPE_TYPE" == "incremental" ]]; then
            echo "No previous database found - falling back to FULL scrape"
            SCRAPE_TYPE="full"
          fi
          
          echo "scrape_type=$SCRAPE_TYPE" >> $GITHUB_OUTPUT
          echo "force=$FORCE" >> $GITHUB_OUTPUT
          echo "create_release=$CREATE_RELEASE" >> $GITHUB_OUTPUT
          echo "announce=$ANNOUNCE" >> $GITHUB_OUTPUT
          
          echo "Scrape parameters determined:"
          echo "  Type: $SCRAPE_TYPE"
          echo "  Force: $FORCE"
          echo "  Create release: $CREATE_RELEASE"
          echo "  Announce: $ANNOUNCE"
      
      - name: Create configuration file
        run: |
          cat > config.yaml <<'EOF'
          # CI/CD Configuration
          base_url: https://irowiki.org
          
          # Database
          database:
            path: data/irowiki.db
            type: sqlite
          
          # Rate limiting
          rate_limit:
            requests_per_second: 2
            burst: 5
            respect_retry_after: true
          
          # Incremental settings
          incremental:
            enabled: true
            lookback_hours: 720  # 30 days
            force_full: false
          
          # Logging
          logging:
            level: INFO
            format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
            file: logs/scrape.log
          
          # Timeouts
          timeouts:
            connect: 30
            read: 60
            total: 300
          
          # Retry
          retry:
            max_attempts: 5
            backoff_factor: 2
          
          # Export settings
          export:
            output_dir: exports/
            xml_format: mediawiki
            include_metadata: true
          EOF
          
          echo "Configuration file created:"
          cat config.yaml
      
      - name: Run scrape
        id: scrape
        run: |
          # Global options (--config/--database/--log-level) must precede
          # the subcommand: argparse rejects them after it.
          SCRAPER_CMD="python -m scraper"
          SCRAPER_CMD="$SCRAPER_CMD --config config.yaml"
          SCRAPER_CMD="$SCRAPER_CMD --database data/irowiki.db"
          SCRAPER_CMD="$SCRAPER_CMD --log-level INFO"

          # Determine command based on scrape type
          if [[ "${{ steps.scrape-params.outputs.scrape_type }}" == "full" ]]; then
            if [[ "${{ steps.scrape-params.outputs.force }}" == "true" ]]; then
              SCRAPER_CMD="$SCRAPER_CMD full --force"
            else
              SCRAPER_CMD="$SCRAPER_CMD full"
            fi
          else
            SCRAPER_CMD="$SCRAPER_CMD incremental"
          fi
          
          # Run scraper with output streaming
          echo "Executing: $SCRAPER_CMD"
          $SCRAPER_CMD 2>&1 | tee logs/scrape.log
          
          # Check exit code
          SCRAPE_EXIT_CODE=${PIPESTATUS[0]}
          echo "Scraper exit code: $SCRAPE_EXIT_CODE"
          
          if [[ $SCRAPE_EXIT_CODE -ne 0 ]]; then
            echo "::error::Scraper failed with exit code $SCRAPE_EXIT_CODE"
            exit $SCRAPE_EXIT_CODE
          fi
          
          echo "✓ Scrape completed successfully"
        env:
          PYTHONUNBUFFERED: "1"  # Force unbuffered output for real-time logs

      - name: Upload scrape database checkpoint
        # Preserve the freshly scraped database BEFORE post-processing
        # (redirect backfill, markdown materialization) so a transient
        # failure in either step cannot discard a whole month of scraping
        # and reset the accumulation chain. The next run's download step
        # prefers the newest artifact across both names, so this
        # checkpoint is the handoff that survives a failed run.
        if: steps.scrape.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: irowiki-database-checkpoint
          path: data/irowiki.db
          retention-days: 90
          compression-level: 9

      - name: Backfill redirect flags
        run: |
          # Populate pages.is_redirect from stored revision content.
          # Offline (no API calls): repairs archives scraped before the
          # flag was populated at scrape time. Incremental runs resume
          # from a previous database artifact, so this pass is required
          # for flag correctness in releases until a full re-scrape.
          python -m scraper \
            --config config.yaml \
            --database data/irowiki.db \
            --log-level INFO \
            --quiet \
            backfill \
            --no-failed-pages \
            --no-links \
            --no-files

          echo "✓ Redirect flags populated"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go.mod
          cache-dependency-path: sdk/go.sum

      - name: Materialize markdown tables
        run: |
          # Build pages_md / pages_md_fts into the release database so
          # consumers get searchable markdown out of the box instead of
          # materializing by hand. Idempotent full rebuild; raw wikitext
          # stays authoritative.
          cd sdk
          go run ./cmd/materialize \
            -db ../data/irowiki.db \
            -namespace 0

          cd ..
          # Fail loudly if the tables are missing or empty.
          MD_ROWS=$(sqlite3 data/irowiki.db "SELECT COUNT(*) FROM pages_md;")
          FTS_ROWS=$(sqlite3 data/irowiki.db "SELECT COUNT(*) FROM pages_md_fts;")
          echo "pages_md rows: $MD_ROWS, pages_md_fts rows: $FTS_ROWS"
          if [[ "$MD_ROWS" -eq 0 || "$FTS_ROWS" -eq 0 ]]; then
            echo "::error::Materialization produced no rows"
            exit 1
          fi

          echo "✓ Markdown tables materialized into release database"

      - name: Generate version tag
        id: version
        run: |
          VERSION="v$(date +%Y-%m)"
          RELEASE_VERSION="${VERSION}.${GITHUB_RUN_NUMBER}"
          RELEASE_DATE="$(date +%Y-%m-%d)"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          
          echo "Release version: $RELEASE_VERSION"
      
      - name: Generate statistics and release notes
        id: stats
        run: |
          bash scripts/generate-stats.sh data/irowiki.db > release-notes.md
          
          echo "Release notes generated:"
          cat release-notes.md
      
      - name: Package release
        run: |
          bash scripts/package-release.sh "${{ steps.version.outputs.release_version }}"
      
      - name: Verify packages
        run: |
          echo "Verifying release packages..."
          
          cd releases/
          
          # Verify checksums
          for checksum_file in *.sha256; do
            if [[ -f "$checksum_file" ]]; then
              echo "Verifying: $checksum_file"
              sha256sum -c "$checksum_file"
            fi
          done
          
          # Test extraction
          echo ""
          echo "Testing extraction..."
          mkdir -p test-extract
          for archive in *.tar.gz; do
            if [[ -f "$archive" && "$archive" != *".part-"* ]]; then
              echo "Testing: $archive"
              tar -tzf "$archive" | head -n 5
              break
            fi
          done
          
          rm -rf test-extract
          
          echo ""
          echo "✓ Package verification complete"
      
      - name: Upload scrape logs
        if: always()  # Upload logs even on failure
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
      
      - name: Upload database artifact for next run
        # The final (post-materialize) database; the checkpoint artifact
        # above already guarantees the scrape handoff even when this run
        # later fails, so success-gating here is safe.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: irowiki-database
          path: data/irowiki.db
          retention-days: 90  # Keep for 3 months
          compression-level: 9  # Maximum compression
      
      - name: Create GitHub Release
        if: success() && steps.scrape-params.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.release_version }}
          name: iRO Wiki Archive - ${{ steps.version.outputs.release_date }}
          body_path: release-notes.md
          files: |
            releases/*.tar.gz*
            releases/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Announce release on Discord
        if: success() && steps.scrape-params.outputs.announce == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Skip if webhook not configured
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Discord webhook not configured, skipping announcement"
            exit 0
          fi
          
          # Read stats for announcement
          TOTAL_PAGES=$(grep -oP 'Total pages: \K\d+' release-notes.md || echo "N/A")
          TOTAL_REVISIONS=$(grep -oP 'Total revisions: \K\d+' release-notes.md || echo "N/A")
          NEW_PAGES=$(grep -oP 'New pages: \K\d+' release-notes.md || echo "0")
          UPDATED_PAGES=$(grep -oP 'Updated pages: \K\d+' release-notes.md || echo "0")
          
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "content": "📚 New iRO Wiki Archive Released!",
            "embeds": [{
              "title": "iRO Wiki Archive - ${{ steps.version.outputs.release_date }}",
              "description": "Monthly archive successfully created and published.",
              "color": 5814783,
              "fields": [
                {
                  "name": "Version",
                  "value": "${{ steps.version.outputs.release_version }}",
                  "inline": true
                },
                {
                  "name": "Total Pages",
                  "value": "$TOTAL_PAGES",
                  "inline": true
                },
                {
                  "name": "Total Revisions",
                  "value": "$TOTAL_REVISIONS",
                  "inline": true
                },
                {
                  "name": "New Pages",
                  "value": "$NEW_PAGES",
                  "inline": true
                },
                {
                  "name": "Updated Pages",
                  "value": "$UPDATED_PAGES",
                  "inline": true
                },
                {
                  "name": "Download",
                  "value": "[GitHub Releases](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.release_version }})"
                }
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
      
      - name: Diagnose scraper failure
        if: failure() && steps.scrape.outcome == 'failure'
        run: |
          echo "=== Scraper Failure Diagnostics ==="
          
          # Show last 100 lines of log
          echo ""
          echo "Last 100 lines of scrape log:"
          if [[ -f "logs/scrape.log" ]]; then
            tail -n 100 logs/scrape.log
          else
            echo "No log file found"
          fi
          
          # Check disk space
          echo ""
          echo "Disk space:"
          df -h
          
          # Check database integrity if exists
          if [[ -f "data/irowiki.db" ]]; then
            echo ""
            echo "Database integrity check:"
            sqlite3 data/irowiki.db "PRAGMA integrity_check;" || echo "Database corrupted"
          fi
      
      - name: Send failure notification to Discord
        if: failure() && github.ref == 'refs/heads/main'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Skip if webhook not configured
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Discord webhook not configured, skipping notification"
            exit 0
          fi
          
          # Send notification using curl instead of action
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "content": "❌ Monthly Scrape Failed",
            "embeds": [{
              "title": "Workflow Failed: ${{ github.workflow }}",
              "description": "The monthly wiki scrape has failed.\n\n**Job:** ${{ github.job }}\n**Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nPlease check the logs for details.",
              "color": 16711680,
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
